name: Publish Alpha Release

on:
  push:
    branches: [main]
    paths:
      - "release/version.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.version }}
      same_commit: ${{ steps.check_ref.outputs.current }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./release/version.json').version")
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Invalid alpha release tag: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify release metadata and desktop version consistency
        run: node scripts/check-release-metadata.mjs
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.existing.outputs.exists == 'false'
        run: npm install --no-audit --no-fund
      - name: Test and build
        if: steps.existing.outputs.exists == 'false'
        run: npm run check
      - name: Bundle web preview
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p build
          (cd apps/web/dist && zip -qr "../../../build/dma-hub-web-${VERSION}.zip" .)
          (cd build && sha256sum "dma-hub-web-${VERSION}.zip" > SHA256SUMS.txt)
          test -s "build/dma-hub-web-${VERSION}.zip"
      - name: Create GitHub prerelease
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$VERSION" "build/dma-hub-web-${VERSION}.zip" build/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DMA Hub ${VERSION} — Alpha Preview" \
            --prerelease \
            --notes-file release/notes.md
      - name: Verify tag references this build commit
        id: check_ref
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TARGET="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha')"
          if [[ "$TARGET" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Existing tag $VERSION points to $TARGET, not the current commit. Skipping desktop upload."
          fi

  windows:
    needs: release
    if: needs.release.outputs.same_commit == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify release metadata
        run: node scripts/check-release-metadata.mjs
      - name: Generate icons
        run: npm run icons -w @dma-hub/desktop
      - name: Build Windows installer
        run: npm run build -w @dma-hub/desktop
      - name: Verify Windows PE header, version and signature status
        shell: pwsh
        run: |
          $meta = Get-Content release/version.json -Raw | ConvertFrom-Json
          $version = $meta.version.Substring(1).Split("-")[0]
          $files = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($files.Count -lt 1) { throw "Missing installer to verify." }
          foreach ($file in $files) {
            ./scripts/verify-windows-installer.ps1 -InstallerPath $file.FullName -ExpectedVersion $version
          }
      - name: Upload unsigned installer and checksum to prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.tag }}
        run: |
          $files = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($files.Count -eq 0) { throw "No Windows installer was built." }
          $hashes = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes += "$hash  $($file.Name)"
            gh release upload "$env:VERSION" "$($file.FullName)" --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Installer upload failed." }
          }
          $hashes | Set-Content -Path "SHA256SUMS-windows.txt" -Encoding utf8NoBOM
          gh release upload "$env:VERSION" "SHA256SUMS-windows.txt" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Checksum upload failed." }
      - name: Confirm downloaded GitHub asset hashes match local installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.tag }}
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP "dma-release-hash-check"
          New-Item -Path $verifyDir -ItemType Directory -Force | Out-Null
          gh release download "$env:VERSION" --repo "$env:GITHUB_REPOSITORY" --pattern "SHA256SUMS-windows.txt" --dir $verifyDir
          if ($LASTEXITCODE -ne 0) { throw "Unable to retrieve published checksum." }
          $records = @(Get-Content (Join-Path $verifyDir "SHA256SUMS-windows.txt"))
          $files = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe")
          foreach ($file in $files) {
            gh release download "$env:VERSION" --repo "$env:GITHUB_REPOSITORY" --pattern "$($file.Name)" --dir $verifyDir
            if ($LASTEXITCODE -ne 0) { throw "Unable to retrieve published installer." }
            $local = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $downloaded = Join-Path $verifyDir $file.Name
            if (-not (Test-Path -LiteralPath $downloaded)) { throw "Published installer missing." }
            $remote = (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($local -ne $remote) { throw "Published installer differs from local build." }
            if ($records -notcontains ("$local  " + $file.Name)) { throw "Published SHA-256 manifest does not match installer." }
          }
          Write-Host "Published Windows installer and SHA-256 records verified."
