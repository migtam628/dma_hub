name: Windows Desktop Build

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "scripts/**"
      - "release/version.json"
      - "packages/ui/**"
      - "package.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "scripts/**"
      - "release/version.json"
      - "packages/ui/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate verifier PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/verify-windows-installer.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify version metadata
        run: node scripts/check-release-metadata.mjs
      - name: Generate Windows icons
        run: npm run icons -w @dma-hub/desktop
      - name: Validate web and API
        run: npm run check
      - name: Bundle NSIS installer
        run: npm run build -w @dma-hub/desktop
      - name: Validate unsigned installer before preview distribution
        shell: pwsh
        run: |
          $meta = Get-Content release/version.json -Raw | ConvertFrom-Json
          $version = $meta.version.Substring(1).Split("-")[0]
          $files = @(Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe")
          if ($files.Count -lt 1) { throw "No installer generated." }
          foreach ($file in $files) {
            ./scripts/verify-windows-installer.ps1 -InstallerPath $file.FullName -ExpectedVersion $version
          }
      - name: Upload unsigned preview installer
        uses: actions/upload-artifact@v4
        with:
          name: dma-hub-windows-unsigned-preview
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
