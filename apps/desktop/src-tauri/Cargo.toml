[package]
name = "dma-hub-desktop"
version = "0.2.0"
description = "DMA Hub local Windows software workspace preview"
authors = ["DMA Hub contributors"]
edition = "2021"
build = "build.rs"

[lib]
name = "dma_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serialport = { version = "4.10", default-features = false }
